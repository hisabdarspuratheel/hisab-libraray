<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISAB LIBRARY - Professional Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Manjari', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-indigo-950 text-white shadow-md sticky top-0 z-30 py-3">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">HISAB LIBRARY</h1>
            <div class="flex items-center space-x-3">
                <span id="currentUserNameDisplay" class="text-xs bg-indigo-900 px-3 py-1 rounded">Guest User</span>
                <button id="adminLoginBtn" onclick="openAdminLoginModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded text-xs font-semibold cursor-pointer">Admin</button>
                <button id="adminLogoutBtn" onclick="logoutAdmin()" class="hidden bg-rose-600 hover:bg-rose-700 text-white px-3 py-1 rounded text-xs font-semibold cursor-pointer">Logout</button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase">Available Books</p>
                <h3 id="statAvailableBooks" class="text-2xl font-bold text-emerald-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase">Issued Books</p>
                <h3 id="statIssuedBooks" class="text-2xl font-bold text-amber-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase">Categories</p>
                <h3 id="statCategories" class="text-2xl font-bold text-indigo-600">0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs font-semibold text-slate-400 uppercase">Total Collection</p>
                <h3 id="statTotalBooks" class="text-2xl font-bold text-blue-600">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-2 mb-6 flex justify-between items-center">
            <div class="space-x-2">
                <button onclick="switchTab('catalog')" id="tabCatalogBtn" class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 text-white cursor-pointer">Book Catalog</button>
                <button onclick="switchTab('issued')" id="tabIssuedBtn" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 cursor-pointer">Issued Records</button>
            </div>
            <div id="adminActionButtons" class="hidden">
                <button onclick="openAddBookModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer"><i class="fa-solid fa-plus mr-1"></i> Add Book</button>
            </div>
        </div>

        <div id="sectionCatalog" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-3">
                <input type="text" id="searchInput" oninput="filterBooks()" placeholder="Search books..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                <select id="categoryFilter" onchange="filterBooks()" class="border px-3 py-2 rounded-lg text-sm bg-white"><option value="ALL">All Categories</option></select>
                <select id="statusFilter" onchange="filterBooks()" class="border px-3 py-2 rounded-lg text-sm bg-white">
                    <option value="ALL">All Status</option>
                    <option value="Available">Available</option>
                    <option value="Issued">Issued</option>
                </select>
            </div>
            <div id="catalogGridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>

        <div id="sectionIssued" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold mb-3">Issued Books</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b text-xs text-slate-500 uppercase">
                        <th class="p-2">Book No</th>
                        <th class="p-2">Title</th>
                        <th class="p-2">Borrower</th>
                        <th class="p-2">Date</th>
                        <th id="tableHeaderActions" class="p-2 text-right hidden">Action</th>
                    </tr>
                </thead>
                <tbody id="issuedTableBody" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <!-- Modals -->
    <div id="adminLoginModal" style="display: none;" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="font-bold mb-3">Admin Login</h3>
            <input type="password" id="adminPasswordInput" placeholder="Password" class="w-full border px-3 py-2 rounded mb-3 text-sm outline-none">
            <button onclick="verifyAdminLogin()" class="w-full bg-indigo-600 text-white py-2 rounded text-sm font-semibold cursor-pointer">Login</button>
        </div>
    </div>

    <div id="addBookModal" style="display: none;" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-3">
            <h3 class="font-bold">Add Book</h3>
            <input type="text" id="newBookNo" placeholder="Book Number" class="w-full border px-3 py-2 rounded text-sm">
            <input type="text" id="newBookTitle" placeholder="Title" class="w-full border px-3 py-2 rounded text-sm">
            <input type="text" id="newBookAuthor" placeholder="Author" class="w-full border px-3 py-2 rounded text-sm">
            <input type="text" id="newBookCategory" placeholder="Category" class="w-full border px-3 py-2 rounded text-sm">
            <button onclick="saveNewBook()" class="w-full bg-emerald-600 text-white py-2 rounded text-sm font-semibold cursor-pointer">Save</button>
        </div>
    </div>

    <div id="issueBookModal" style="display: none;" class="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-3">
            <h3 class="font-bold">Issue Book</h3>
            <input type="hidden" id="issueBookKey">
            <input type="text" id="borrowerNameInput" placeholder="Borrower Name" class="w-full border px-3 py-2 rounded text-sm">
            <button onclick="confirmIssueBook()" class="w-full bg-amber-600 text-white py-2 rounded text-sm font-semibold cursor-pointer">Confirm</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://hisab-library-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let booksData = {};
        let isAdminLoggedIn = false;
        let activePath = 'books'; // Default

        // Smart path detector for both 'books' and 'libraryData/books'
        db.ref('/').on('value', (snapshot) => {
            let rootVal = snapshot.val() || {};
            if (rootVal.libraryData && rootVal.libraryData.books) {
                activePath = 'libraryData/books';
                booksData = rootVal.libraryData.books;
            } else if (rootVal.books) {
                activePath = 'books';
                booksData = rootVal.books;
            } else {
                booksData = rootVal;
            }

            updateStats();
            updateCategoryDropdowns();
            filterBooks();
        });

        function updateStats() {
            let books = Object.values(booksData).filter(b => b && typeof b === 'object');
            let total = books.length;
            let issued = books.filter(b => (b.status || b.bookStatus) === 'Issued').length;
            let available = total - issued;
            let cats = new Set(books.map(b => b.category || b.bookCategory || 'General')).size;

            document.getElementById('statTotalBooks').textContent = total;
            document.getElementById('statAvailableBooks').textContent = available;
            document.getElementById('statIssuedBooks').textContent = issued;
            document.getElementById('statCategories').textContent = cats;
        }

        function filterBooks() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            let filtered = Object.entries(booksData).filter(([key, book]) => {
                if (!book || typeof book !== 'object') return false;
                let title = (book.title || book.bookTitle || '').toLowerCase();
                let author = (book.author || book.bookAuthor || '').toLowerCase();
                let num = (book.bookNum || book.bookNo || book.number || '').toLowerCase();
                let category = book.category || book.bookCategory || 'General';
                let currentStatus = book.status || book.bookStatus || 'Available';

                return (title.includes(query) || author.includes(query) || num.includes(query)) &&
                       (cat === 'ALL' || category === cat) &&
                       (status === 'ALL' || currentStatus === status);
            });

            renderCatalog(filtered);
            renderIssuedList();
        }

        function renderCatalog(entries) {
            const container = document.getElementById('catalogGridContainer');
            container.innerHTML = '';
            entries.forEach(([key, book]) => {
                let displayNum = book.bookNum || book.bookNo || book.number || key;
                let title = book.title || book.bookTitle || 'Untitled Book';
                let author = book.author || book.bookAuthor || 'Unknown Author';
                let category = book.category || book.bookCategory || 'General';
                let currentStatus = book.status || book.bookStatus || 'Available';
                let isIssued = currentStatus === 'Issued';

                let actionBtn = isAdminLoggedIn ? (isIssued ? 
                    `<button onclick="returnBook('${key}')" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs cursor-pointer">Return</button>` : 
                    `<button onclick="openIssueModal('${key}')" class="bg-amber-600 text-white px-2 py-1 rounded text-xs cursor-pointer">Issue</button>`) : '';

                let card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl border border-slate-200 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${displayNum}</span>
                            <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full ${isIssued ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${currentStatus}</span>
                        </div>
                        <h4 class="font-bold text-sm mt-2">${title}</h4>
                        <p class="text-xs text-slate-500">${author}</p>
                    </div>
                    <div class="flex justify-between items-center mt-4 pt-2 border-t">
                        <span class="text-xs bg-slate-100 px-2 py-0.5 rounded">${category}</span>
                        ${actionBtn}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderIssuedList() {
            const tbody = document.getElementById('issuedTableBody');
            const th = document.getElementById('tableHeaderActions');
            tbody.innerHTML = '';
            if(isAdminLoggedIn) th.classList.remove('hidden'); else th.classList.add('hidden');

            let issued = Object.entries(booksData).filter(([k, b]) => b && typeof b === 'object' && (b.status || b.bookStatus) === 'Issued');
            issued.forEach(([key, book]) => {
                let displayNum = book.bookNum || book.bookNo || book.number || key;
                let title = book.title || book.bookTitle || 'Untitled';
                let author = book.author || book.bookAuthor || 'Unknown';
                let actionTd = isAdminLoggedIn ? `<td class="p-2 text-right"><button onclick="returnBook('${key}')" class="bg-emerald-600 text-white px-2 py-1 rounded text-xs cursor-pointer">Return</button></td>` : '';
                tbody.innerHTML += `<tr class="border-b"><td class="p-2 font-semibold text-indigo-600">${displayNum}</td><td class="p-2"><div>${title}</div><div class="text-xs text-slate-400">${author}</div></td><td class="p-2 text-indigo-600 font-semibold">${book.issuedTo || ''}</td><td class="p-2">${book.issueDate || ''}</td>${actionTd}</tr>`;
            });
        }

        function updateCategoryDropdowns() {
            const select = document.getElementById('categoryFilter');
            let cats = new Set(Object.values(booksData).filter(b => b && typeof b === 'object').map(b => b.category || b.bookCategory || 'General'));
            select.innerHTML = '<option value="ALL">All Categories</option>';
            cats.forEach(c => { if(c) select.innerHTML += `<option value="${c}">${c}</option>`; });
        }

        function switchTab(tab) {
            document.getElementById('sectionCatalog').classList.toggle('hidden', tab !== 'catalog');
            document.getElementById('sectionIssued').classList.toggle('hidden', tab !== 'issued');
        }

        function openAdminLoginModal() { document.getElementById('adminLoginModal').style.display = 'flex'; }
        function closeAdminLoginModal() { document.getElementById('adminLoginModal').style.display = 'none'; }
        function verifyAdminLogin() {
            if(document.getElementById('adminPasswordInput').value === '123321') {
                isAdminLoggedIn = true;
                document.getElementById('currentUserNameDisplay').textContent = 'Admin';
                document.getElementById('adminLoginBtn').classList.add('hidden');
                document.getElementById('adminLogoutBtn').classList.remove('hidden');
                document.getElementById('adminActionButtons').classList.remove('hidden');
                closeAdminLoginModal();
                filterBooks();
            } else { alert('Wrong Password'); }
        }
        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('currentUserNameDisplay').textContent = 'Guest User';
            document.getElementById('adminLogoutBtn').classList.add('hidden');
            document.getElementById('adminLoginBtn').classList.remove('hidden');
            document.getElementById('adminActionButtons').classList.add('hidden');
            filterBooks();
        }

        function openAddBookModal() { document.getElementById('addBookModal').style.display = 'flex'; }
        function closeAddBookModal() { document.getElementById('addBookModal').style.display = 'none'; }
        function saveNewBook() {
            let title = document.getElementById('newBookTitle').value.trim();
            if(!title) return alert('Enter title');
            db.ref(activePath).push({
                bookNo: document.getElementById('newBookNo').value.trim() || 'N/A',
                title: title,
                author: document.getElementById('newBookAuthor').value.trim() || 'Unknown',
                category: document.getElementById('newBookCategory').value.trim() || 'General',
                status: 'Available'
            }, () => closeAddBookModal());
        }

        function openIssueModal(key) {
            document.getElementById('issueBookKey').value = key;
            document.getElementById('issueBookModal').style.display = 'flex';
        }
        function closeIssueBookModal() { document.getElementById('issueBookModal').style.display = 'none'; }
        function confirmIssueBook() {
            let key = document.getElementById('issueBookKey').value;
            let borrower = document.getElementById('borrowerNameInput').value.trim();
            if(!borrower) return alert('Enter borrower name');
            db.ref(activePath + '/' + key).update({ status: 'Issued', issuedTo: borrower, issueDate: new Date().toLocaleDateString() }, () => closeIssueBookModal());
        }

        function returnBook(key) {
            if(confirm('Return book?')) {
                db.ref(activePath + '/' + key).update({ status: 'Available', issuedTo: null, issueDate: null });
            }
        }
    </script>
</body>
</html>
