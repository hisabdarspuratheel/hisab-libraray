<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISAB LIBRARY & QUTHUBKHANA - Digital Catalog System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Manjari', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col overflow-x-hidden">

    <!-- Header Section -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-30 py-2 sm:py-3">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-2 sm:gap-0">
                
                <div class="flex items-center justify-between w-full sm:w-auto">
                    <div class="flex items-center space-x-2.5">
                        <div class="bg-[#5a1827] p-2 rounded-xl shadow-lg flex items-center justify-center border border-[#7a2236]">
                            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 6l10 4 10-4M2 6v12l10 4 10-4V6M12 10v12" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6 8l4 1.5M14 9.5l4-1.5M6 11l4 1.5M14 12.5l4-1.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div>
                            <h1 id="brandTitle" class="text-base sm:text-xl font-bold tracking-tight text-white leading-tight">HISAB LIBRARY</h1>
                            <p id="brandSubtitle" class="text-[10px] sm:text-xs text-indigo-200">Digital Catalog System</p>
                        </div>
                    </div>
                </div>

                <!-- Section Selector Switch -->
                <div class="flex items-center space-x-1 bg-indigo-950/70 p-1 rounded-xl border border-indigo-700/60">
                    <button onclick="switchSection('library')" id="sectionLibBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-amber-500 text-indigo-950 shadow cursor-pointer">
                        <i class="fa-solid fa-book-bookmark mr-1"></i> Library
                    </button>
                    <button onclick="switchSection('quthubkhana')" id="sectionQuthubBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-indigo-200 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-kaaba mr-1"></i> Quthubkhana (عربي)
                    </button>
                </div>

                <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-2 pt-1 sm:pt-0 border-t border-indigo-800/60 sm:border-0">
                    <div class="flex items-center space-x-1.5 bg-indigo-800/85 px-2.5 py-1 rounded-lg border border-indigo-700 text-[11px] sm:text-xs">
                        <i class="fa-solid fa-user-circle text-indigo-300"></i>
                        <span id="currentUserNameDisplay" class="font-medium text-indigo-100 truncate max-w-[90px] sm:max-w-none">Guest User</span>
                        <button onclick="promptUserLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-1.5 py-0.5 rounded text-[10px] font-semibold cursor-pointer">
                            Change
                        </button>
                    </div>

                    <button id="adminLoginBtn" onclick="openAdminLoginModal()" class="flex items-center space-x-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 text-white px-2.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs font-semibold shadow cursor-pointer">
                        <i class="fa-solid fa-lock text-[10px] sm:text-xs"></i>
                        <span>Admin</span>
                    </button>

                    <button id="adminLogoutBtn" onclick="adminLogout()" class="hidden flex items-center space-x-1 bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs font-semibold shadow cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket text-[10px] sm:text-xs"></i>
                        <span>Exit Admin</span>
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 flex-grow w-full">
        
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4 mb-4 sm:mb-6">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 flex items-center justify-between">
                <div>
                    <p class="text-
